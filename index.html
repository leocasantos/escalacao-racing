<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escalação Racing · FIFA 27</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --celeste: #6cace4;
    --celeste-escuro: #2f6fa8;
    --branco: #ffffff;
    --fundo: #0d1b2a;
    --painel: #13263a;
    --texto: #eaf2fa;
    --suave: #9fb4c8;
    --grama1: #2e7d32;
    --grama2: #348a38;
    --linha: rgba(255,255,255,.75);
    --ouro1: #f6e3a1;
    --ouro2: #c9a24a;
    --ouro-texto: #3b2a07;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Inter, system-ui, sans-serif; background: var(--fundo); color: var(--texto); }
  header { text-align: center; padding: 20px 16px 8px; }
  header h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: .5px; }
  header h1 span { color: var(--celeste); }
  header p { margin: 6px 0 0; color: var(--suave); font-size: 14px; }
  .barra { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; padding: 10px 16px; font-size: 14px; }
  .chip { background: var(--painel); border: 1px solid #24425f; border-radius: 999px; padding: 6px 12px; }
  .chip b { color: var(--celeste); }
  button { font: inherit; cursor: pointer; }
  .link { background: none; border: none; color: var(--celeste); text-decoration: underline; padding: 0; }
  main { max-width: 560px; margin: 0 auto; padding: 0 16px 40px; }
  .campo {
    position: relative; width: min(100%, calc((100vh - 190px) * 0.68)); min-width: min(100%, 350px); margin: 0 auto; aspect-ratio: 68 / 100; border-radius: 14px; overflow: hidden;
    background: repeating-linear-gradient(180deg, var(--grama1) 0 10%, var(--grama2) 10% 20%);
    border: 3px solid var(--linha); box-shadow: 0 10px 30px rgba(0,0,0,.4);
  }
  .campo .l { position: absolute; border: 2px solid var(--linha); }
  .meio { left: 0; right: 0; top: 50%; border-width: 2px 0 0 0 !important; }
  .circulo { width: 26%; aspect-ratio: 1; border-radius: 50%; left: 37%; top: 50%; transform: translateY(-50%); }
  .area-c { left: 22%; right: 22%; top: -2px; height: 15%; }
  .area-b { left: 22%; right: 22%; bottom: -2px; height: 15%; }
  .peq-c { left: 37%; right: 37%; top: -2px; height: 6%; }
  .peq-b { left: 37%; right: 37%; bottom: -2px; height: 6%; }
  .slot {
    position: absolute; transform: translate(-50%, -50%); width: 24%;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    background: none; border: none; color: var(--branco); padding: 0;
  }
  .camisa {
    position: relative; width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center;
    font-weight: 800; font-size: 15px; color: var(--celeste-escuro);
    background: repeating-linear-gradient(90deg, var(--celeste) 0 9px, var(--branco) 9px 18px);
    border: 2px solid var(--branco); box-shadow: 0 3px 8px rgba(0,0,0,.4);
  }
  .camisa.foto { background: linear-gradient(160deg, var(--ouro1), var(--ouro2)); border-color: var(--ouro1); }
  .camisa.foto img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 15%; border-radius: 50%; }
  .camisa .ovr { z-index: 1; position: absolute; right: -8px; top: -6px; background: var(--ouro-texto); color: var(--ouro1);
                 font-size: 11px; border-radius: 6px; padding: 1px 4px; border: 1px solid var(--ouro1); }
  .camisa:not(.foto) .ovr { position: static; background: var(--branco); color: var(--celeste-escuro); border: none; font-size: 15px; }
  .vazio .camisa { background: rgba(255,255,255,.15); border: 2px dashed var(--branco); color: var(--branco); font-size: 22px; }
  .nome { font-size: 12px; font-weight: 700; background: rgba(0,0,0,.55); border-radius: 6px; padding: 2px 6px; max-width: 100%;
          text-align: center; line-height: 1.2; overflow-wrap: anywhere;
          display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .pos { font-size: 10px; font-weight: 600; opacity: .9; }
  .por { font-size: 10px; color: #d6ecff; opacity: .9; }
  h2 { font-size: 16px; margin: 22px 0 10px; }
  .banco { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; background: var(--painel); border-radius: 12px; padding: 12px 6px; }
  .banco .slot { position: static; transform: none; width: auto; }
  .status { text-align: center; font-size: 12px; color: var(--suave); margin-top: 16px; }
  /* janelas */
  .fundo-modal { position: fixed; inset: 0; background: rgba(0,0,0,.65); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  .fundo-modal.aberto { display: flex; }
  .modal { background: var(--painel); border-radius: 14px; padding: 20px; width: 100%; max-width: 380px; border: 1px solid #24425f;
           max-height: calc(100vh - 32px); overflow-y: auto; }
  .modal h3 { margin: 0 0 4px; }
  .modal p { margin: 0 0 14px; color: var(--suave); font-size: 14px; }
  .modal p:empty { display: none; }
  label { display: block; font-size: 13px; color: var(--suave); margin: 10px 0 4px; }
  input { width: 100%; font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid #2c4d6d; background: #0d1b2a; color: var(--texto); }
  .acoes { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .btn { flex: 1; padding: 10px 12px; border-radius: 8px; border: none; font-weight: 700; }
  .btn.prim { background: var(--celeste); color: #0d1b2a; }
  .btn.sec { background: #24425f; color: var(--texto); }
  .btn.perigo { background: #7a2630; color: #fff; }
  /* resultados da busca */
  .resultados { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .res { display: flex; align-items: center; gap: 10px; text-align: left; width: 100%; background: #0d1b2a; color: var(--texto);
         border: 1px solid #24425f; border-radius: 10px; padding: 6px 10px; }
  .res:hover, .res:focus { border-color: var(--celeste); outline: none; }
  .res img.f { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; object-position: top; background: #24425f; }
  .res .info { flex: 1; min-width: 0; }
  .res .n { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .res .c { font-size: 12px; color: var(--suave); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .res .o { font-weight: 800; font-size: 18px; color: var(--ouro1); text-align: right; line-height: 1; }
  .res .o small { display: block; font-size: 10px; color: var(--suave); font-weight: 600; }
  .dica { font-size: 13px; color: var(--suave); text-align: center; padding: 8px 0; }
  /* carta */
  .carta {
    position: relative; width: 230px; margin: 4px auto 0; aspect-ratio: 0.72; padding: 16px 16px 14px;
    background: linear-gradient(160deg, var(--ouro1) 0%, #e8c96f 45%, var(--ouro2) 100%);
    clip-path: polygon(50% 0, 100% 6%, 100% 88%, 50% 100%, 0 88%, 0 6%);
    color: var(--ouro-texto); display: flex; flex-direction: column; align-items: center;
  }
  .carta .topo { position: absolute; left: 20px; top: 26px; display: flex; flex-direction: column; align-items: center; line-height: 1; z-index: 1; }
  .carta .topo b { font-size: 38px; font-weight: 800; }
  .carta .topo span { font-size: 15px; font-weight: 700; margin-top: 2px; }
  .carta .topo img { width: 26px; margin-top: 6px; }
  .carta .rosto { width: 150px; height: 150px; object-fit: cover; object-position: top; margin-top: 8px; margin-left: 30px; }
  .carta .rosto.wiki { width: 128px; height: 128px; margin: 18px 0 6px 30px; border-radius: 50%; object-position: center 20%;
                       border: 3px solid rgba(59,42,7,.35); }
  .carta .nm { font-weight: 800; font-size: 19px; margin-top: 2px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .carta .linha-st { width: 80%; border-top: 1px solid rgba(59,42,7,.35); margin: 4px 0; }
  .carta .stats { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; width: 100%; text-align: center; }
  .carta .stats div { font-size: 10px; font-weight: 600; }
  .carta .stats b { display: block; font-size: 15px; font-weight: 800; }
  .carta .base { display: flex; gap: 10px; align-items: center; margin-top: 6px; }
  .carta .base img { height: 20px; }
  .carta-legenda { text-align: center; font-size: 13px; color: var(--suave); margin-top: 8px; }
</style>
</head>
<body>
<header>
  <h1>Racing <span>· FIFA 27</span></h1>
  <p>Esquema 3-5-2 · toque numa posição para escolher o jogador</p>
</header>

<div class="barra">
  <span class="chip">Você: <b id="eu">—</b> <button class="link" id="trocarNome">trocar</button></span>
  <span class="chip">Escalados: <b id="total">0</b>/15</span>
</div>
<div class="barra" id="placar"></div>

<main>
  <div class="campo" id="campo">
    <div class="l meio"></div><div class="l circulo"></div>
    <div class="l area-c"></div><div class="l area-b"></div>
    <div class="l peq-c"></div><div class="l peq-b"></div>
  </div>
  <h2>Reservas</h2>
  <div class="banco" id="banco"></div>
  <div class="status" id="status">Conectando…</div>
</main>

<div class="fundo-modal" id="mNome">
  <div class="modal">
    <h3>Quem é você?</h3>
    <p>Seu nome aparece embaixo de cada jogador que você escolher.</p>
    <input id="inNome" maxlength="20" placeholder="Ex.: Leonardo">
    <div class="acoes"><button class="btn prim" id="salvarNome">Entrar</button></div>
  </div>
</div>

<div class="fundo-modal" id="mSlot">
  <div class="modal">
    <h3 id="mTitulo">Posição</h3>
    <p id="mInfo"></p>

    <div id="vCarta" hidden>
      <div id="cartaBox"></div>
      <div class="carta-legenda" id="cartaLegenda"></div>
      <div class="acoes">
        <button class="btn sec" id="voltar">Voltar</button>
        <button class="btn perigo" id="limpar">Remover</button>
        <button class="btn prim" id="principal">Escalar</button>
      </div>
    </div>

    <div id="vBusca">
      <label for="inBusca">Buscar jogador no FIFA 27 (qualquer time)</label>
      <input id="inBusca" maxlength="40" placeholder="Ex.: Martínez, Messi, Rojas…" autocomplete="off">
      <div class="resultados" id="resultados"><div class="dica">Digite pelo menos 2 letras.</div></div>
      <div class="acoes"><button class="btn sec" id="cancelar">Cancelar</button></div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm';

const db = createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

// Posições no campo (x, y em % — ataque para cima)
const LAYOUT = {
  ate: [33, 11], atd: [67, 11],
  mei: [50, 28],
  ale: [12, 44], vle: [34, 55], vld: [66, 55], ald: [88, 44],
  zge: [20, 72], zgc: [50, 72], zgd: [80, 72],
  gk:  [50, 89],
};
const NOMES_POS = { GOL: 'Goleiro', ZAG: 'Zagueiro', 'ALA E': 'Ala esquerdo', 'ALA D': 'Ala direito',
                    MEI: 'Meia armador', VOL: 'Volante', ATA: 'Atacante', RES: 'Reserva' };

let slots = {};
let atual = null; // posição aberta
const $ = (id) => document.getElementById(id);
// Silhueta para jogadores sem foto no site da EA
const SILHUETA = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="38" r="20" fill="#7d8a96"/><path d="M14 100c0-22 16-36 36-36s36 14 36 36z" fill="#7d8a96"/></svg>');
window.semFoto = (img) => { img.onerror = null; img.src = SILHUETA; };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function getEu() { try { return localStorage.getItem('racing-nome') || ''; } catch { return ''; } }
function setEu(n) { try { localStorage.setItem('racing-nome', n); } catch {} $('eu').textContent = n; }
let eu = getEu();

function abrirNome() { $('inNome').value = eu; $('mNome').classList.add('aberto'); $('inNome').focus(); }
$('salvarNome').onclick = () => {
  const n = $('inNome').value.trim();
  if (!n) return;
  eu = n; setEu(n); $('mNome').classList.remove('aberto');
};
$('inNome').onkeydown = (e) => { if (e.key === 'Enter') $('salvarNome').click(); };
$('trocarNome').onclick = abrirNome;
if (eu) setEu(eu); else abrirNome();

function htmlSlot(s) {
  const c = s.card;
  let camisa;
  if (c && c.photo) {
    camisa = `<span class="camisa foto"><img src="${esc(c.photo)}" alt="" loading="lazy" onerror="semFoto(this)"><span class="ovr">${esc(c.ovr)}</span></span>`;
  } else if (s.player) {
    camisa = `<span class="camisa">${s.overall ? `<span class="ovr">${s.overall}</span>` : ''}</span>`;
  } else {
    camisa = `<span class="camisa">+</span>`;
  }
  return `${camisa}
    <span class="nome">${esc(s.player ? (c?.short || s.player) : 'Escolher')}</span>
    <span class="pos">${esc(s.label)}</span>
    ${s.player && s.picked_by ? `<span class="por">por ${esc(s.picked_by)}</span>` : ''}`;
}

function render() {
  document.querySelectorAll('.slot').forEach(e => e.remove());
  const lista = Object.values(slots).sort((a, b) => a.sort - b.sort);
  for (const s of lista) {
    const b = document.createElement('button');
    b.className = 'slot' + (s.player ? '' : ' vazio');
    b.innerHTML = htmlSlot(s);
    b.onclick = () => abrirSlot(s.id);
    if (LAYOUT[s.id]) {
      b.style.left = LAYOUT[s.id][0] + '%';
      b.style.top = LAYOUT[s.id][1] + '%';
      $('campo').appendChild(b);
    } else {
      $('banco').appendChild(b);
    }
  }
  const cheios = lista.filter(s => s.player);
  $('total').textContent = cheios.length;
  const cont = {};
  cheios.forEach(s => { const p = s.picked_by || '?'; cont[p] = (cont[p] || 0) + 1; });
  $('placar').innerHTML = Object.entries(cont)
    .map(([p, n]) => `<span class="chip">${esc(p)}: <b>${n}</b></span>`).join('');
}

function htmlCarta(c) {
  return `<div class="carta">
    <div class="topo"><b>${esc(c.ovr)}</b><span>${esc(c.pos)}</span>
      ${c.nationImg ? `<img src="${esc(c.nationImg)}" alt="${esc(c.nation)}">` : ''}</div>
    <img class="rosto${c.fotoWiki ? ' wiki' : ''}" src="${esc(c.photo)}" alt="${esc(c.name)}" onerror="semFoto(this)">
    <div class="nm">${esc(c.short)}</div>
    <div class="linha-st"></div>
    <div class="stats">${(c.stats || []).map(([k, v]) => `<div><b>${v ?? '–'}</b>${esc(k)}</div>`).join('')}</div>
    <div class="base">${c.clubImg ? `<img src="${esc(c.clubImg)}" alt="${esc(c.club)}">` : ''}</div>
  </div>`;
}

// Mostra a carta: modo 'novo' (confirmar escolha) ou 'atual' (jogador já escalado)
function mostrarCarta(c, modo) {
  $('vBusca').hidden = true;
  $('vCarta').hidden = false;
  $('mInfo').textContent = '';
  $('cartaBox').innerHTML = c ? htmlCarta(c) : '';
  const quem = atual.picked_by ? ` · escolhido por ${atual.picked_by}` : '';
  $('cartaLegenda').textContent = c
    ? `${c.name} · ${c.club || ''}${modo === 'atual' ? quem : ''}`
    : `${atual.player}${quem}`;
  $('limpar').style.display = modo === 'atual' ? '' : 'none';
  $('principal').textContent = modo === 'atual' ? 'Trocar' : 'Escalar';
  $('voltar').textContent = modo === 'atual' ? 'Fechar' : 'Voltar';
  $('principal').onclick = modo === 'atual'
    ? mostrarBusca
    : () => gravar({ player: c.name, overall: c.ovr, card: c, picked_by: eu });
  $('voltar').onclick = modo === 'atual' ? fechar : mostrarBusca;
}

function mostrarBusca() {
  $('vCarta').hidden = true;
  $('vBusca').hidden = false;
  $('mInfo').textContent = 'Busque o jogador pelo nome.';
  $('inBusca').focus();
}

function abrirSlot(id) {
  if (!eu) return abrirNome();
  atual = slots[id];
  $('mTitulo').textContent = NOMES_POS[atual.label] || atual.label;
  $('inBusca').value = '';
  $('resultados').innerHTML = '<div class="dica">Digite pelo menos 2 letras.</div>';
  $('mSlot').classList.add('aberto');
  if (atual.player) mostrarCarta(atual.card, 'atual'); else mostrarBusca();
}
function fechar() { $('mSlot').classList.remove('aberto'); atual = null; }
$('cancelar').onclick = fechar;
$('mSlot').onclick = (e) => { if (e.target.id === 'mSlot') fechar(); };

let timer = null, ultimaBusca = 0;
$('inBusca').oninput = () => {
  clearTimeout(timer);
  const q = $('inBusca').value.trim();
  if (q.length < 2) { $('resultados').innerHTML = '<div class="dica">Digite pelo menos 2 letras.</div>'; return; }
  $('resultados').innerHTML = '<div class="dica">Buscando…</div>';
  timer = setTimeout(() => buscar(q), 350);
};
async function buscar(q) {
  const n = ++ultimaBusca;
  try {
    const palavras = q.normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase().split(/\s+/).filter(Boolean);
    let consulta = db.from('players').select('data');
    for (const p of palavras) consulta = consulta.ilike('busca', `%${p.replace(/[%_]/g, '')}%`);
    const { data: linhas, error } = await consulta.order('ovr', { ascending: false }).limit(20);
    if (error) throw error;
    const lista = linhas.map(l => l.data);
    if (n !== ultimaBusca) return;
    if (!Array.isArray(lista) || !lista.length) {
      $('resultados').innerHTML = '<div class="dica">Nenhum jogador encontrado. Tente o sobrenome.</div>';
      return;
    }
    $('resultados').innerHTML = '';
    for (const c of lista) {
      const b = document.createElement('button');
      b.className = 'res';
      b.innerHTML = `<img class="f" src="${esc(c.photo)}" alt="" loading="lazy" onerror="semFoto(this)">
        <span class="info"><div class="n">${esc(c.name)}</div><div class="c">${esc(c.club || '')} · ${esc(c.pos)}</div></span>
        <span class="o">${esc(c.ovr)}<small>OVR</small></span>`;
      b.onclick = () => mostrarCarta(c, 'novo');
      $('resultados').appendChild(b);
    }
  } catch {
    if (n === ultimaBusca) $('resultados').innerHTML = '<div class="dica">Busca indisponível agora. Tente de novo.</div>';
  }
}

async function gravar(dados) {
  const { data, error } = await db.from('slots')
    .update({ ...dados, updated_at: new Date().toISOString() })
    .eq('id', atual.id).select().single();
  if (error) { $('cartaLegenda').textContent = 'Não consegui salvar. Tente de novo.'; return; }
  slots[data.id] = data; render(); fechar();
}
$('limpar').onclick = () => gravar({ player: null, overall: null, card: null, picked_by: null });

async function carregar() {
  const { data, error } = await db.from('slots').select('*');
  if (error) { $('status').textContent = 'Erro ao carregar a escalação.'; return; }
  slots = Object.fromEntries(data.map(s => [s.id, s]));
  render();
  $('status').textContent = 'Ao vivo · as escolhas dos outros aparecem sozinhas';
}

db.channel('slots')
  .on('postgres_changes', { event: '*', schema: 'public', table: 'slots' }, (p) => {
    if (p.new && p.new.id) { slots[p.new.id] = p.new; render(); }
  })
  .subscribe();

carregar();
</script>
</body>
</html>
